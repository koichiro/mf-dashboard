name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, new-release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node
      - run: node --test scripts/release/*.test.mjs
      - run: shellcheck docker/release/update.sh
      - run: node scripts/release/context-smoke.mjs

  publish-images:
    needs: [test, build-demo, docker-build, e2e-web, release-test]
    if: >-
      github.event.repository.fork &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish a matched image pair
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          release="images-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver docker-container
          for app in web crawler; do
            docker buildx build --platform linux/amd64 --push \
              --file "docker/$app/Dockerfile" \
              --tag "ghcr.io/$repository-$app:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --cache-from "type=registry,ref=ghcr.io/$repository-$app:buildcache" \
              --cache-to "type=registry,ref=ghcr.io/$repository-$app:buildcache,mode=max" \
              --metadata-file "$app-metadata.json" .
          done
          node scripts/release/package.mjs "$repository" "$GITHUB_SHA" "$release" \
            "$(jq -er '."containerimage.digest"' web-metadata.json)" \
            "$(jq -er '."containerimage.digest"' crawler-metadata.json)" bundle
          tar -czf deployment.tar.gz -C bundle .
          sha256sum deployment.tar.gz > deployment.tar.gz.sha256
          gh release create "$release" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "$release" --notes "linux/amd64 deployment bundle; image digests are recorded in release.env."
          gh release upload "$release" deployment.tar.gz deployment.tar.gz.sha256 --repo "$GITHUB_REPOSITORY"
          gh release edit "$release" --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Log out
        if: always()
        run: docker logout ghcr.io

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node
      - run: pnpm lint --format=github
      - run: pnpm format --check
      - run: pnpm knip
      - run: pnpm typecheck --affected
      - run: pnpm test --affected
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node
      - run: pnpm build:demo --affected
      - run: pnpm --filter @mf-dashboard/db build:demo
      - run: pnpm --filter @mf-dashboard/db test:demo
  docker-build:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: mf-dashboard
      CLOUDFLARE_ACCESS_AUD: ci-access-audience
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ci.cloudflareaccess.com
      DASHBOARD_URL: https://dashboard.example.com
      REFRESH_TOKEN: ci-refresh-token
    strategy:
      fail-fast: false
      matrix:
        app: [crawler, web]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cp .env.example .env
      - run: docker compose build ${{ matrix.app }}
      - run: node scripts/release/smoke.mjs ${{ matrix.app }} mf-dashboard-${{ matrix.app }}
  build-e2e-web:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: DEMO_MODE=false pnpm --filter @mf-dashboard/web build
      - run: |
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -R apps/web/public apps/web/.next/standalone/apps/web/public
          tar -czf e2e-web-build.tar.gz -C apps/web/.next/standalone .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-web-build
          path: e2e-web-build.tar.gz
          retention-days: 1
  e2e-web:
    needs: build-e2e-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8.0.1
        with:
          name: e2e-web-build
          path: .artifacts
      - run: |
          mkdir -p apps/web/.next/standalone
          tar -xzf .artifacts/e2e-web-build.tar.gz -C apps/web/.next/standalone
      - run: pnpm test:e2e:web -- --shard=${{ matrix.shard }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-blob-report-${{ strategy.job-index }}
          path: apps/web/blob-report/
          retention-days: 7

  merge-e2e-report:
    if: ${{ !cancelled() }}
    needs: e2e-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@v8.0.1
        with:
          path: all-blob-reports
          pattern: playwright-blob-report-*
          merge-multiple: true
      - run: pnpm --filter @mf-dashboard/web exec playwright merge-reports --reporter html ../../all-blob-reports
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
